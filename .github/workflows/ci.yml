name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: studychat
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: studychat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studychat -d studychat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STUDYCHAT_TEST_DATABASE_URL: postgresql://studychat:test-only@127.0.0.1:5432/studychat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: python scripts/create_demo_pdf.py
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
        env:
          STUDYCHAT_PYTHON: python
